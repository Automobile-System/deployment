apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automobile.fullname" . }}-backend
  labels:
    {{- include "automobile.labels" . | nindent 4 }}
    app: automobile-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "automobile.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automobile.backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "automobile.fullname" . }}-db-config
            - secretRef:
                name: {{ include "automobile.fullname" . }}-db-secret
          env:
            - name: JAVA_OPTS
              value: {{ .Values.backend.javaOpts | quote }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.backend.jpa.ddlAuto | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12


