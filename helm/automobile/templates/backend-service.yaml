apiVersion: v1
kind: Service
metadata:
  name: {{ include "automobile.fullname" . }}-backend-service
  labels:
    {{- include "automobile.labels" . | nindent 4 }}
    app: automobile-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "automobile.backend.selectorLabels" . | nindent 4 }}

