apiVersion: v1
kind: Service
metadata:
  name: {{ include "automobile.fullname" . }}-frontend-service
  labels:
    {{- include "automobile.labels" . | nindent 4 }}
    app: automobile-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "automobile.frontend.selectorLabels" . | nindent 4 }}

