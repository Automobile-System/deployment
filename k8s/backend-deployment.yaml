apiVersion: apps/v1
kind: Deployment
metadata:
  name: automobile-backend
  labels:
    app: automobile-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automobile-backend
  template:
    metadata:
      labels:
        app: automobile-backend
    spec:
      containers:
        - name: backend
          image: adithyahewage/automobile-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neon-db-config
            - secretRef:
                name: neon-db-secret
          env:
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

