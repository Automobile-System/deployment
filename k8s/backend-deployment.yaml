apiVersion: apps/v1
kind: Deployment
metadata:
  name: automobile-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automobile-backend
  template:
    metadata:
      labels:
        app: automobile-backend
    spec:
      containers:
        - name: backend
          image: yourusername/automobile-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: neon-db-config
            - secretRef:
                name: neon-db-secret

