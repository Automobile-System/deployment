services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: automobile-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://ep-holy-river-a8f0y6nq-pooler.eastus2.azure.neon.tech:5432/neondb?sslmode=require}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-neondb_owner}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-npg_qbgjWXc5nJ3h}
    networks:
      - automobile-network
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'java.*app.jar' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=http://localhost:8080
    container_name: automobile-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - automobile-network
    restart: unless-stopped

networks:
  automobile-network:
    driver: bridge

