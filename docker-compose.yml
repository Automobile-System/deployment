services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: automobile-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - APP_SECURITY_JWT_SECRET_KEY=${APP_SECURITY_JWT_SECRET_KEY}
      - APP_SECURITY_CORS_ALLOWED_ORIGINS=${APP_SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - automobile-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
    container_name: automobile-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - automobile-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  automobile-network:
    driver: bridge

